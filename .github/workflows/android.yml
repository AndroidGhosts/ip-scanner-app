name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Validate Gradle wrapper
      run: |
        ./gradlew --version

    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ip-scanner-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Check build outputs
      run: |
        find . -name "*.apk" -type f
        ls -la app/build/outputs/apk/debug/ || echo "APK directory not found"
